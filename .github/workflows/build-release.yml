name: Build and release

# Builds the CoreGraphics probes on a macOS runner and publishes the binaries
# as a GitHub release. Every push to any branch cuts a release tagged
# `build-<run>-<sha>`; pushing a `v*` tag cuts a release with that tag. A
# manual run also publishes a release, using the generated tag.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -a
          cc --version
          xcrun --show-sdk-path

      # The documented recipe: an x86_64 guest binary to run under rosemary.
      # `-fblocks` is needed for the `CGPathApplyWithBlock` probe.
      - name: Compile x86_64
        run: |
          cc -arch x86_64 -fblocks -framework CoreGraphics -o cgtransform_probe cgtransform-probe.c
          cc -arch x86_64 -fblocks -framework CoreGraphics -o cgpath_probe cgpath-probe.c

      # Native slices so the output can be checked on the arm64 runner without
      # depending on Rosetta.
      - name: Compile arm64
        run: |
          cc -arch arm64 -fblocks -framework CoreGraphics -o cgtransform_probe_arm64 cgtransform-probe.c
          cc -arch arm64 -fblocks -framework CoreGraphics -o cgpath_probe_arm64 cgpath-probe.c

      - name: Build universal binaries
        run: |
          lipo -create -output cgtransform_probe_universal cgtransform_probe cgtransform_probe_arm64
          lipo -create -output cgpath_probe_universal cgpath_probe cgpath_probe_arm64

      - name: Verify architectures
        run: |
          file cgtransform_probe cgtransform_probe_arm64 cgtransform_probe_universal \
               cgpath_probe cgpath_probe_arm64 cgpath_probe_universal
          lipo -info cgtransform_probe_universal
          lipo -info cgpath_probe_universal

      - name: Smoke test (native)
        run: |
          case "$(uname -m)" in
            arm64) suffix=_arm64 ;;
            *)     suffix= ;;
          esac
          "./cgtransform_probe$suffix" > expected-cgtransform.txt
          "./cgpath_probe$suffix" > expected-cgpath.txt
          cat expected-cgtransform.txt
          cat expected-cgpath.txt

      # A tag push keeps its tag; anything else gets a unique, traceable tag.
      - name: Resolve release tag
        id: release
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="build-${GITHUB_RUN_NUMBER}-$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Package
        run: |
          set -euo pipefail
          name="cgprobes-${{ steps.release.outputs.tag }}-macos"
          mkdir -p "dist/$name"
          cp cgtransform_probe \
             cgtransform_probe_arm64 \
             cgtransform_probe_universal \
             cgpath_probe \
             cgpath_probe_arm64 \
             cgpath_probe_universal \
             cgtransform-probe.c \
             cgpath-probe.c \
             expected-cgtransform.txt \
             expected-cgpath.txt \
             "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cgprobes-macos
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
